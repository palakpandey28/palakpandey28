name: Generate contribution snake

on:
  # Regenerate every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Run manually from the Actions tab
  workflow_dispatch:
  # Also run when the workflow itself changes
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

# Needed so the job can push the generated SVGs to the `output` branch
permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and publish snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate snake from live contribution data
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0e4a5a,#0e7490,#22d3ee,#a5f3fc

      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          git init -q -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: regenerate contribution snake"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" output
